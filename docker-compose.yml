services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapidtask-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_NAME: RapidTask
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rapidtask
      DB_USERNAME: rapidtask
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rapidtask

  nginx:
    image: nginx:1.25-alpine
    container_name: rapidtask-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rapidtask

  mysql:
    image: mysql:5.7
    container_name: rapidtask-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: rapidtask
      MYSQL_USER: rapidtask
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rapidtask

  node:
    image: node:14-alpine
    container_name: rapidtask-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    profiles:
      - assets
    networks:
      - rapidtask

networks:
  rapidtask:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
