services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapidtask-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_NAME: RapidTask
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rapidtask
      DB_USERNAME: rapidtask
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rapidtask

  nginx:
    image: nginx:1.27-alpine
    container_name: rapidtask-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rapidtask

  mysql:
    image: mysql:8.4
    container_name: rapidtask-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: rapidtask
      MYSQL_USER: rapidtask
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - rapidtask

  node:
    image: node:22-alpine
    container_name: rapidtask-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    profiles:
      - assets
    networks:
      - rapidtask

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapidtask-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_NAME: RapidTask
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rapidtask
      DB_USERNAME: rapidtask
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - rapidtask

networks:
  rapidtask:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
